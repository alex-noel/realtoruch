name: realtoruch
x-service: &service
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: base
  restart: unless-stopped
  init: true
  environment: &environment
    DATABASE_URL: postgresql+psycopg://rentals:local-development-only@postgres:5432/rentals
    AUTH_DATABASE_URL: postgresql+psycopg://rentals:local-development-only@postgres:5432/auth
    DEMO_MODE: "true"
    ELASTICSEARCH_URL: http://elasticsearch:9200
    SEARCH_SERVICE_URL: http://search:8000
    AUTH_SERVICE_URL: http://auth:8000
    API_BASE_URL: http://api:8000
    CONNECTORS_CONFIG: /config/sources.json
    JWT_SECRET: ${JWT_SECRET:-local-demo-jwt-key-change-before-deployment-32-chars}
    PHONE_HASH_KEY: ${PHONE_HASH_KEY:-local-demo-phone-key-change-before-deployment}
    INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-demo-internal-key-change-before-deployment}
    EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-disabled}
    EMAIL_FROM: "${EMAIL_FROM:-Realtoruch <alerts@example.invalid>}"
    PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8081}
    SMTP_HOST: ${SMTP_HOST:-}
    VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    EXPO_PUSH_ENABLED: ${EXPO_PUSH_ENABLED:-false}
  networks: [private]
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rentals
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: rentals
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./infra/local/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentals -d rentals"]
      interval: 5s
      retries: 20
    networks: [private]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.6
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: ["elasticsearch:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health > /dev/null"]
      interval: 10s
      retries: 30
    networks: [private]
  migrate:
    <<: *service
    restart: "no"
    command: ["sh", "-c", "python -m realtoruch.worker migrate && python -m realtoruch.seed"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *service
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  auth:
    <<: *service
    ports: ["127.0.0.1:8001:8000"]
    command: ["uvicorn", "realtoruch.auth:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  auth-worker:
    <<: *service
    environment:
      <<: *environment
      SERVICE_ROLE: auth
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    command: ["python", "-m", "realtoruch.auth_jobs", "--loop"]
    depends_on:
      auth: { condition: service_started }
  search:
    <<: *service
    ports: ["127.0.0.1:8002:8000"]
    command: ["uvicorn", "realtoruch.search:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    depends_on:
      elasticsearch: { condition: service_healthy }
  indexer:
    <<: *service
    command: ["python", "-m", "realtoruch.worker", "index", "--loop"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      elasticsearch: { condition: service_healthy }
  alerts:
    <<: *service
    environment:
      <<: *environment
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_PREVIEW_DIRECTORY: /tmp/mail
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      EXPO_PUSH_ACCESS_TOKEN: ${EXPO_PUSH_ACCESS_TOKEN:-}
    command: ["python", "-m", "realtoruch.worker", "alerts", "--loop"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  collector:
    <<: *service
    command: ["python", "-m", "realtoruch.worker", "collect", "--loop"]
    volumes: ["./config/sources.json:/config/sources.json:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  postgres:
  elasticsearch:
networks:
  private:
    driver: bridge
