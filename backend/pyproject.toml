[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[project]
name = "realtoruch"
version = "0.1.0"
description = "Polish rental intelligence and aggregation services"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.163.2,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<3", "psycopg[binary]>=3.3.9,<4",
  "pydantic-settings>=2.8,<3", "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5", "protego>=0.7,<1", "PyJWT[crypto]>=2.15,<3",
  "google-cloud-storage==3.17.1",
  "Pillow>=13,<14",
  "argon2-cffi>=23.1,<26", "prometheus-client>=0.21,<1", "pywebpush>=2.5,<3"
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "python-hcl2>=7,<9", "PyYAML>=6,<7"]
cloud = ["google-cloud-pubsub>=2.29,<3", "google-cloud-bigtable>=2.30,<3", "google-cloud-secret-manager>=2.23,<3", "cloud-sql-python-connector[pg8000]>=1.18,<2"]
gcp = ["realtoruch[cloud]", "apache-beam[gcp]>=2.78,<3"]

[tool.setuptools.packages.find]
include = ["realtoruch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
